/* OVEN PREMIUM ADMIN — matched storefront identity */
:root{
 --bg:#080808;--panel:#141414;--panel2:#202020;--ink:#f7f7f7;

}
html{min-height:100%;scroll-behavior:smooth}
body{
 min-height:100vh;
 background:radial-gradient(ellipse at 50% -18%,#c9a34f18,transparent 43%),var(--bg);

 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.wrap{width:min(1480px,calc(100% - 48px));margin-inline:auto}
.top{
 min-height:82px;padding:16px 0;position:relative;
 border-bottom:1px solid #ffffff18;
}

 border-radius:999px;padding:11px 17px;min-height:42px;
 transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);border-color:var(--gold);background:#242424}
.btn:active{transform:translateY(0)}
.gold{
 background:linear-gradient(120deg,#f0d58f,#c9a34f 62%,#a98032);
 color:#111;border:1px solid #e8cb84;font-weight:900;
 box-shadow:0 9px 28px #c9a34f24;
}

 margin:clamp(42px,9vh,100px) auto;max-width:460px;
 padding:clamp(22px,4vw,38px);border-radius:24px;
 background:linear-gradient(145deg,#1b1b1b,#101010);

}

}

.actions button{border-radius:999px}
.danger{color:#ffaaaa;border-color:#713e3e}
.tablewrap{border:1px solid #ffffff18;border-radius:14px;max-width:100%}
table{min-width:720px}
td,th{padding:14px 13px}
tr:hover td{background:#ffffff06}
.upload{border:1px dashed #c9a34f88;background:#c9a34f0b;border-radius:15px}
.preview{border:1px solid #c9a34f66}
.notice{border:1px solid #c9a34f55;background:#c9a34f12;color:#f0dcae;border-radius:13px}

.toast{border:1px solid #f0d58f;background:#d6b15e;color:#111;font-weight:800;box-shadow:var(--shadow);border-radius:999px}

async function login(){const error=$('loginError');if(!fbAuth){error.textContent='Firebase غير جاهز. أعد تحميل الصفحة وتأكد من السماح بتحميل gstatic.com.';return}const email=$('email').value.trim(),password=$('password').value;if(!email||!password){error.textContent='اكتب البريد الإلكتروني وكلمة المرور أولًا.';return}const btn=$('loginBtn');btn.disabled=true;btn.textContent='جارٍ التحقق…';error.textContent='جارٍ الاتصال بخدمة تسجيل الدخول…';try{const cred=await fbAuth.signInWithEmailAndPassword(email,password);if(cred.user.uid!==ADMIN_UID){const actualUid=cred.user.uid;await fbAuth.signOut();error.textContent='تم قبول البريد وكلمة المرور، لكن الحساب ليس UID المدير المحدد في الملف. UID الحالي: '+actualUid+' — يجب مراجعة ADMIN_UID أو حساب المدير في Firebase.';return}error.textContent='تم التحقق بنجاح. جاري تحميل لوحة التحكم…';$('login').classList.add('hidden');$('app').style.display='block';startCloud();render()}catch(e){console.error('OVEN login failed:',e);error.textContent='تعذر الدخول: '+authErrorText(e)}finally{btn.disabled=false;btn.textContent='دخول آمن'}}

function productPage(){let p=products.find(x=>String(x.id)===String(editing));$('content').innerHTML=`<div class="sectiontitle"><div><h2>${p?'تعديل منتج':'إدارة المنتجات'}</h2><p class="muted">أضف المنتجات وعدّل الصور والأسعار والمقاسات والألوان والمخزون.</p></div><div class="toolbar"><button class="btn" id="newProduct">＋ منتج جديد</button></div></div><form id="productForm" class="form"><input class="field" name="ar" placeholder="اسم المنتج بالعربي" required value="${esc(p?.ar||'')}"><input class="field" name="en" placeholder="Product name in English" value="${esc(p?.en||'')}" required><input class="field" name="price" type="number" min="0" placeholder="السعر الحالي بالجنيه" value="${p?.price??''}" required><input class="field" name="old" type="number" min="0" placeholder="السعر قبل الخصم (اختياري)" value="${p?.old||''}"><input class="field" name="stock" type="number" min="0" placeholder="الكمية في المخزون" value="${p?.stock??0}" required><select class="field" name="cat"><option value="tee" ${p?.cat==='tee'?'selected':''}>تيشيرتات</option><option value="hoodie" ${p?.cat==='hoodie'?'selected':''}>هوديز</option><option value="jacket" ${p?.cat==='jacket'?'selected':''}>جاكيتات</option><option value="accessory" ${p?.cat==='accessory'?'selected':''}>إكسسوارات</option></select><input class="field" name="sizes" placeholder="المقاسات مفصولة بفاصلة: S,M,L,XL" value="${esc((p?.sizes||['S','M','L','XL','XXL']).join(','))}"><input class="field" name="colors" placeholder="الألوان مفصولة بفاصلة" value="${esc((p?.colors||['أسود','أبيض']).join(','))}"><textarea class="field wide" name="desc" placeholder="وصف المنتج بالعربي">${esc(p?.desc||'')}</textarea><label class="upload wide"><b>صورة المنتج من جهازك</b><p class="muted">اختار صورة عادية من الكمبيوتر أو الموبايل — سيتم ضغطها لتناسب المتجر.</p><input id="imageFile" type="file" accept="image/*"><p id="imageUploadStatus" class="muted" role="status" aria-live="polite">الصورة المضغوطة ستُحفظ مع بيانات المنتج في قاعدة بيانات المتجر.</p><img id="preview" class="preview" src="${esc(p?.img||'')}" style="${p?.img?'display:block':''}"></label><div class="wide toolbar"><button class="btn gold" type="submit">${p?'حفظ التعديلات':'إضافة المنتج'}</button><button class="btn" type="button" id="cancelEdit">إلغاء</button></div></form><div class="sectiontitle" style="margin-top:30px"><h3>المنتجات الحالية (${products.length})</h3><input class="field" id="adminProductSearch" placeholder="ابحث باسم المنتج أو الفئة..." style="max-width:320px"></div><div class="products">${products.map(x=>`<article class="prod" data-product-search="${esc((x.ar||'')+' '+(x.en||'')+' '+(x.cat||'')).toLowerCase()}"><img src="${esc(x.img||'')}" alt=""><div><h3>${esc(x.ar)}</h3><p>${money(x.price)} · المخزون: ${x.stock}</p><p>${esc(x.cat)}</p><div class="actions"><button class="btn" data-edit="${x.id}">تعديل</button><button class="btn danger" data-delete="${x.id}">حذف</button></div></div></article>`).join('')||'<div class="empty">لا توجد منتجات.</div>'}</div>`;
$('adminProductSearch').oninput=e=>{let q=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-product-search]').forEach(card=>card.style.display=card.dataset.productSearch.includes(q)?'grid':'none')};$('newProduct').onclick=()=>{editing=null;imageData='';productPage()};$('cancelEdit').onclick=()=>{editing=null;imageData='';productPage()};$('imageFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;const status=$('imageUploadStatus');if(!file.type.startsWith('image/')){if(status)status.textContent='الملف المختار ليس صورة مدعومة.';return alert('اختار ملف صورة صالح')}try{if(status)status.textContent='جارٍ تجهيز الصورة وضغطها…';imageData=await compressImage(file);$('preview').src=imageData;$('preview').style.display='block';if(status)status.textContent='تم تجهيز الصورة ('+(Math.round(imageSizeBytes(imageData)/1024))+' كيلوبايت تقريبًا). اضغط حفظ لتخزينها مع المنتج.'}catch(err){imageData='';if(status)status.textContent=err.message||'تعذر قراءة الصورة';alert(err.message||'تعذر قراءة الصورة')}};
$('productForm').onsubmit=async e=>{e.preventDefault();const submit=e.submitter||$('productForm').querySelector('[type=submit]');if(submit){submit.disabled=true;submit.textContent='جارٍ الحفظ…'}try{const f=new FormData(e.target),oldProduct=products.find(x=>String(x.id)===String(editing)),id=oldProduct?oldProduct.id:String(Date.now());let img=oldProduct?.img||'';if(imageData){const bytes=imageSizeBytes(imageData);if(bytes>380*1024)throw new Error('حجم الصورة بعد الضغط أكبر من الحد الآمن لقاعدة البيانات. اختار صورة أصغر.');img=imageData}if(submit)submit.textContent='جارٍ حفظ بيانات المنتج…';const st=$('imageUploadStatus');if(st&&imageData)st.textContent='تم تجهيز الصورة — جارٍ حفظها مع بيانات المنتج في قاعدة البيانات…';const obj={id:Number(id)||id,ar:String(f.get('ar')||'').trim(),en:String(f.get('en')||'').trim(),price:Number(f.get('price')),old:Number(f.get('old'))||0,stock:Number(f.get('stock')),cat:String(f.get('cat')||'tee'),sizes:String(f.get('sizes')||'').split(',').map(x=>x.trim()).filter(Boolean),colors:String(f.get('colors')||'').split(',').map(x=>x.trim()).filter(Boolean),desc:String(f.get('desc')||'').trim(),img};if(!obj.ar||!obj.en||!Number.isFinite(obj.price)||obj.price<0||!Number.isFinite(obj.stock)||obj.stock<0)throw new Error('راجع اسم المنتج والسعر والكمية.');const saved=await saveProductToCloud(obj);if(!saved)throw new Error('لم يتم حفظ المنتج في قاعدة البيانات. راجع حالة الاتصال وقواعد Firestore.');const next=oldProduct?products.map(x=>String(x.id)===String(id)?obj:x):[obj,...products];products=next;try{localStorage.setItem('z_products',JSON.stringify(products))}catch(storageError){console.warn('Local cache not updated:',storageError)}editing=null;imageData='';toast(oldProduct?'تم تحديث المنتج في المتجر':'تمت إضافة المنتج إلى المتجر');productPage()}catch(err){console.error('OVEN product save error:',err);toast(err.message||'تعذر حفظ المنتج');cloudStatus('تعذر حفظ المنتج','bad')}finally{if(submit){submit.disabled=false;submit.textContent=editing?'حفظ التعديلات':'إضافة المنتج'}}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;imageData='';productPage()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('متأكد من حذف المنتج؟'))return;const btn=b;btn.disabled=true;btn.textContent='جارٍ الحذف…';const id=String(b.dataset.delete);try{const saved=await deleteProductFromCloud(id);if(!saved)throw new Error('لم يتم حذف المنتج من Firebase. راجع صلاحيات Firestore.');products=products.filter(x=>String(x.id)!==id);try{localStorage.setItem('z_products',JSON.stringify(products))}catch(_){}if(String(editing)===id)editing=null;toast('تم حذف المنتج من المتجر بنجاح');productPage()}catch(err){console.error('OVEN product delete error:',err);toast(err.message||'تعذر حذف المنتج');btn.disabled=false;btn.textContent='حذف'}})}
function compressImage(file){return new Promise((resolve,reject)=>{if(file.size>20*1024*1024)return reject(new Error('الصورة الأصلية أكبر من 20 ميجابايت. اختار صورة أصغر.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('تعذر قراءة ملف الصورة من الجهاز.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة أو الملف تالف.'));img.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');if(!ctx)return reject(new Error('المتصفح لم يتمكن من تجهيز الصورة.'));let max=1200,data='',quality=.78;for(let attempt=0;attempt<24;attempt++){const scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',quality);if(imageSizeBytes(data)<=340*1024)break;if(quality>.42)quality-=.06;else{quality=.42;max=Math.max(420,Math.round(max*.82))}}if(!data||imageSizeBytes(data)>380*1024)return reject(new Error('تعذر ضغط الصورة للحجم الآمن لقاعدة البيانات. جرّب صورة أصغر أو قصّها.'));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
function orderPage(){$('content').innerHTML=`<div class="sectiontitle"><div><h2>الطلبات والمبيعات</h2><p class="muted">راجع تفاصيل العملاء وحدّث حالة كل طلب.</p></div><div class="toolbar"><input class="field" id="orderSearch" placeholder="ابحث برقم الطلب أو الاسم أو الهاتف" style="min-width:min(290px,70vw)"><button class="btn" id="export">تصدير CSV</button></div></div><div class="tablewrap"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.name)}<br><small>${esc(o.address)}</small></td><td>${esc(o.phone)}</td><td>${money(o.total)}</td><td>${new Date(o.date).toLocaleString('ar-EG')}</td><td><select class="field" data-status="${esc(o.id)}">${['جديد','قيد التجهيز','تم الشحن','تم التسليم','ملغي'].map(st=>`<option ${o.status===st?'selected':''}>${st}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>${orders.length?'':'<div class="empty">لا توجد طلبات محفوظة حتى الآن.</div>'}`;document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{let o=orders.find(x=>String(x.id)===s.dataset.status);if(o){o.status=s.value;set('z_orders',orders);toast('تم تحديث حالة الطلب')}});$('export').onclick=()=>downloadCSV('oven-orders.csv',[['Order','Date','Name','Phone','Address','Total','Status'],...orders.map(o=>[o.id,o.date,o.name,o.phone,o.address,o.total,o.status])]);$('orderSearch').oninput=()=>{let q=$('orderSearch').value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q))}}
function couponPage(){$('content').innerHTML=`<div class="sectiontitle"><div><h2>كوبونات الخصم</h2><p class="muted">أنشئ أكواد خصم ثابتة أو نسبة مئوية.</p></div></div><form id="couponForm" class="form"><input class="field" name="code" placeholder="كود الخصم مثل VIP15" required><select class="field" name="type"><option value="percent">نسبة مئوية %</option><option value="fixed">مبلغ ثابت EGP</option></select><input class="field" name="value" type="number" min="1" placeholder="قيمة الخصم" required><button class="btn gold">إضافة الكوبون</button></form><div style="margin-top:20px">${coupons.map((c,i)=>`<div class="prod" style="margin:8px 0;display:flex;align-items:center;justify-content:space-between"><div><b>${esc(c.code)}</b><p>${c.type==='percent'?c.value+'%':money(c.value)} · ${c.active===false?'متوقف':'نشط'}</p></div><div class="actions"><button class="btn" data-togglecoupon="${i}">${c.active===false?'تفعيل':'إيقاف'}</button><button class="btn danger" data-delcoupon="${i}">حذف</button></div></div>`).join('')}</div>`;$('couponForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code').trim().toUpperCase();if(coupons.some(x=>x.code===code))return alert('هذا الكود موجود بالفعل');coupons.push({code,type:f.get('type'),value:+f.get('value'),active:true});set('z_coupons',coupons);couponPage();toast('تم إنشاء الكوبون')};document.querySelectorAll('[data-togglecoupon]').forEach(b=>b.onclick=()=>{let c=coupons[+b.dataset.togglecoupon];c.active=c.active===false;set('z_coupons',coupons);couponPage()});document.querySelectorAll('[data-delcoupon]').forEach(b=>b.onclick=()=>{coupons.splice(+b.dataset.delcoupon,1);set('z_coupons',coupons);couponPage()})}
function settingsPage(){$('content').innerHTML=`<div class="sectiontitle"><div><h2>إعدادات المتجر</h2><p class="muted">عدّل بيانات التواصل ومحتوى واجهة المتجر.</p></div></div><form id="settingsForm" class="form"><label class="wide muted">رقم واتساب استقبال الطلبات<input class="field" name="whatsapp" placeholder="201001740923" value="${esc(settings.whatsapp||'201001740923')}"></label><label class="wide muted">عنوان الواجهة بالعربي (HTML مسموح للعناصر البسيطة)<input class="field" name="heroAr" value="${esc(settings.heroAr||'OVEN<span>Wear The Future</span>')}"></label><label class="wide muted">وصف الواجهة بالعربي<textarea class="field" name="taglineAr">${esc(settings.taglineAr||'أكثر من مجرد ملابس.. أسلوب حياة. اكتشف مجموعتنا واختار القطعة اللي تعبّر عن شخصيتك.')}</textarea></label><label class="wide muted">وصف الواجهة بالإنجليزي<textarea class="field" name="taglineEn">${esc(settings.taglineEn||'More than fashion — a way of life. Explore our collection and find the pieces that express your identity.')}</textarea></label><button class="btn gold wide">حفظ إعدادات المتجر</button></form><div class="notice">التغييرات تظهر على واجهة المتجر بعد إعادة تحميلها. بيانات الإعدادات والطلبات والمنتجات مشتركة بين الصفحتين على نفس المتصفح ونفس النطاق.</div>`;$('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);settings={...settings,whatsapp:String(f.get('whatsapp')).replace(/\D/g,''),heroAr:f.get('heroAr'),taglineAr:f.get('taglineAr'),taglineEn:f.get('taglineEn')};set('z_settings',settings);toast('تم حفظ الإعدادات')}}
function downloadCSV(name,rows){let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
if(fbAuth)fbAuth.onAuthStateChanged(user=>{if(user&&user.uid===ADMIN_UID){$('login').classList.add('hidden');$('app').style.display='block';startCloud();render()}else{$('app').style.display='none';$('login').classList.remove('hidden');if(user&&user.uid!==ADMIN_UID){fbAuth.signOut().catch(console.error);$('loginError').textContent='الحساب مسجل لكنه غير معتمد كمدير. UID الحالي: '+user.uid+' — راجع قيمة ADMIN_UID داخل admin.html.'}}});
})();
</script>
