let products=get('z_products',null),orders=get('z_orders',[]),coupons=get('z_coupons',[{code:'ZODIAC10',type:'percent',value:10,active:true},{code:'WELCOME50',type:'fixed',value:50,active:true}]),settings=get('z_settings',{}),tab='dashboard',editing=null,imageData='';
if(!Array.isArray(products)||!products.length){products=defaultProducts;try{localStorage.setItem('z_products',JSON.stringify(products))}catch(e){}}
const money=n=>Number(n||0).toLocaleString('en-US')+' EGP';const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)};const persist=()=>{set('z_products',products);set('z_orders',orders);set('z_coupons',coupons);set('z_settings',settings)};
async function login(){ $('loginError').textContent='جارٍ تسجيل الدخول…';try{const cred=await fbAuth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);if(cred.user.uid!==ADMIN_UID){await fbAuth.signOut();throw new Error('هذا الحساب ليس حساب المدير المصرّح به.')}sessionStorage.setItem('z_admin_session','1');$('login').classList.add('hidden');$('app').style.display='block';startCloud();render();}catch(e){$('loginError').textContent='تعذر الدخول: '+(e.code==='auth/invalid-credential'?'راجع البريد وكلمة المرور.':e.message)}}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=async()=>{cloudUnsubs.forEach(u=>u());cloudReady=false;await fbAuth.signOut();sessionStorage.removeItem('z_admin_session');$('app').style.display='none';$('login').classList.remove('hidden');$('password').value=''};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
function render(){products=get('z_products',products);orders=get('z_orders',orders);coupons=get('z_coupons',coupons);settings=get('z_settings',settings);if(tab==='dashboard')dashboard();if(tab==='products')productPage();if(tab==='orders')orderPage();if(tab==='coupons')couponPage();if(tab==='settings')settingsPage()}
function dashboard(){let sales=orders.filter(o=>o.status!=='ملغي').reduce((s,o)=>s+(+o.total||0),0),pending=orders.filter(o=>['جديد','قيد التجهيز'].includes(o.status)).length,stock=products.reduce((s,p)=>s+(+p.stock||0),0),days=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));let key=d.toDateString(),amount=orders.filter(o=>o.status!=='ملغي'&&new Date(o.date).toDateString()===key).reduce((sum,o)=>sum+(+o.total||0),0);return {label:d.toLocaleDateString('ar-EG',{weekday:'short'}),amount}}),max=Math.max(1,...days.map(x=>x.amount));$('content').innerHTML=`<div class="sectiontitle"><div><h2>نظرة عامة</h2><p class="muted">ملخص سريع لحالة متجر OVEN</p></div><span class="badge">ADMIN</span></div><div class="stats"><div class="stat"><small>عدد المنتجات</small><b>${products.length}</b></div><div class="stat"><small>إجمالي الطلبات</small><b>${orders.length}</b></div><div class="stat"><small>طلبات تحتاج متابعة</small><b>${pending}</b></div><div class="stat"><small>إجمالي المبيعات المسجلة</small><b>${money(sales)}</b></div></div><div class="chartbox"><div class="sectiontitle"><div><h3>المبيعات خلال آخر 7 أيام</h3><p class="muted">حسب تاريخ الطلبات المسجلة — لا تمثل مدفوعات مؤكدة</p></div></div><div class="chartbars">${days.map(d=>`<div class="chartday" title="${money(d.amount)}"><b>${d.amount?Math.round(d.amount):'—'}</b><i style="height:${Math.max(3,d.amount/max*100)}%"></i><small>${d.label}</small></div>`).join('')}</div></div><div class="notice">البيانات المعروضة مأخوذة من سجلات المتجر الحالية. تأكد من تفعيل خدمات Firebase وقواعد الأمان قبل استقبال طلبات حقيقية.</div><h3>آخر الطلبات</h3>${orders.slice(0,5).map(o=>`<p class="muted">#${esc(o.id)} · ${esc(o.name)} · ${money(o.total)} · ${esc(o.status)}</p>`).join('')||'<div class="empty">لا توجد طلبات بعد.</div>'}<h3>ملخص المخزون</h3><p class="muted">إجمالي الوحدات المسجلة: ${stock} — منتجات نفد مخزونها: ${products.filter(p=>+p.stock<=0).length} — منتجات مخزونها منخفض (5 أو أقل): ${products.filter(p=>+p.stock>0&&+p.stock<=5).length}</p><div class="notice"><b>تنبيهات المخزون</b><br>${products.filter(p=>+p.stock<=5).slice(0,8).map(p=>`${esc(p.ar)}: ${+p.stock<=0?'نفد المخزون':'متبقي '+p.stock}`).join(' · ')||'لا توجد تنبيهات مخزون حاليًا.'}</div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function productPage(){let p=products.find(x=>x.id===editing);$('content').innerHTML=`<div class="sectiontitle"><div><h2>${p?'تعديل منتج':'إدارة المنتجات'}</h2><p class="muted">أضف المنتجات وعدّل الصور والأسعار والمقاسات والألوان والمخزون.</p></div><div class="toolbar"><button class="btn" id="newProduct">＋ منتج جديد</button></div></div><form id="productForm" class="form"><input class="field" name="ar" placeholder="اسم المنتج بالعربي" required value="${esc(p?.ar||'')}"><input class="field" name="en" placeholder="Product name in English" value="${esc(p?.en||'')}" required><input class="field" name="price" type="number" min="0" placeholder="السعر الحالي بالجنيه" value="${p?.price??''}" required><input class="field" name="old" type="number" min="0" placeholder="السعر قبل الخصم (اختياري)" value="${p?.old||''}"><input class="field" name="stock" type="number" min="0" placeholder="الكمية في المخزون" value="${p?.stock??0}" required><select class="field" name="cat"><option value="tee" ${p?.cat==='tee'?'selected':''}>تيشيرتات</option><option value="hoodie" ${p?.cat==='hoodie'?'selected':''}>هوديز</option><option value="jacket" ${p?.cat==='jacket'?'selected':''}>جاكيتات</option><option value="accessory" ${p?.cat==='accessory'?'selected':''}>إكسسوارات</option></select><input class="field" name="sizes" placeholder="المقاسات مفصولة بفاصلة: S,M,L,XL" value="${esc((p?.sizes||['S','M','L','XL','XXL']).join(','))}"><input class="field" name="colors" placeholder="الألوان مفصولة بفاصلة" value="${esc((p?.colors||['أسود','أبيض']).join(','))}"><textarea class="field wide" name="desc" placeholder="وصف المنتج بالعربي">${esc(p?.desc||'')}</textarea><label class="upload wide"><b>صورة المنتج من جهازك</b><p class="muted">اختار صورة عادية من الكمبيوتر أو الموبايل — سيتم ضغطها لتناسب المتجر.</p><input id="imageFile" type="file" accept="image/*"><img id="preview" class="preview" src="${esc(p?.img||'')}" style="${p?.img?'display:block':''}"></label><div class="wide toolbar"><button class="btn gold" type="submit">${p?'حفظ التعديلات':'إضافة المنتج'}</button><button class="btn" type="button" id="cancelEdit">إلغاء</button></div></form><div class="sectiontitle" style="margin-top:30px"><h3>المنتجات الحالية (${products.length})</h3><input class="field" id="adminProductSearch" placeholder="ابحث باسم المنتج أو الفئة..." style="max-width:320px"></div><div class="products">${products.map(x=>`<article class="prod" data-product-search="${esc((x.ar||'')+' '+(x.en||'')+' '+(x.cat||'')).toLowerCase()}"><img src="${esc(x.img||'')}" alt=""><div><h3>${esc(x.ar)}</h3><p>${money(x.price)} · المخزون: ${x.stock}</p><p>${esc(x.cat)}</p><div class="actions"><button class="btn" data-edit="${x.id}">تعديل</button><button class="btn danger" data-delete="${x.id}">حذف</button></div></div></article>`).join('')||'<div class="empty">لا توجد منتجات.</div>'}</div>`;
$('adminProductSearch').oninput=e=>{let q=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-product-search]').forEach(card=>card.style.display=card.dataset.productSearch.includes(q)?'grid':'none')};$('newProduct').onclick=()=>{editing=null;imageData='';productPage()};$('cancelEdit').onclick=()=>{editing=null;imageData='';productPage()};$('imageFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('اختار ملف صورة صالح');try{imageData=await compressImage(file);$('preview').src=imageData;$('preview').style.display='block'}catch(err){alert(err.message||'تعذر قراءة الصورة')}};
$('productForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),oldProduct=products.find(x=>x.id===editing),img=imageData||oldProduct?.img||products[0]?.img||'';let obj={id:oldProduct?oldProduct.id:Math.max(0,...products.map(x=>+x.id||0))+1,ar:f.get('ar').trim(),en:f.get('en').trim(),price:+f.get('price'),old:+f.get('old')||0,stock:+f.get('stock'),cat:f.get('cat'),sizes:f.get('sizes').split(',').map(x=>x.trim()).filter(Boolean),colors:f.get('colors').split(',').map(x=>x.trim()).filter(Boolean),desc:f.get('desc').trim(),img};if(oldProduct)products=products.map(x=>x.id===oldProduct.id?obj:x);else products.unshift(obj);if(!set('z_products',products))return;editing=null;imageData='';toast('تم حفظ المنتج');productPage()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=+b.dataset.edit;imageData='';productPage()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('متأكد من حذف المنتج؟')){products=products.filter(x=>x.id!==+b.dataset.delete);set('z_products',products);productPage();toast('تم حذف المنتج')}})}
function compressImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let max=720,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.56);if(data.length>650000)return reject(new Error('حجم الصورة بعد الضغط ما زال كبيرًا. اختار صورة أصغر.'));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
function orderPage(){$('content').innerHTML=`<div class="sectiontitle"><div><h2>الطلبات والمبيعات</h2><p class="muted">راجع تفاصيل العملاء وحدّث حالة كل طلب.</p></div><button class="btn" id="export">تصدير CSV</button></div><div class="tablewrap"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.name)}<br><small>${esc(o.address)}</small></td><td>${esc(o.phone)}</td><td>${money(o.total)}</td><td>${new Date(o.date).toLocaleString('ar-EG')}</td><td><select class="field" data-status="${esc(o.id)}">${['جديد','قيد التجهيز','تم الشحن','تم التسليم','ملغي'].map(st=>`<option ${o.status===st?'selected':''}>${st}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>${orders.length?'':'<div class="empty">لا توجد طلبات محفوظة حتى الآن.</div>'}`;document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{let o=orders.find(x=>String(x.id)===s.dataset.status);if(o){o.status=s.value;set('z_orders',orders);toast('تم تحديث حالة الطلب')}});$('export').onclick=()=>downloadCSV('oven-orders.csv',[['Order','Date','Name','Phone','Address','Total','Status'],...orders.map(o=>[o.id,o.date,o.name,o.phone,o.address,o.total,o.status])])}
function couponPage(){$('content').innerHTML=`<div class="sectiontitle"><div><h2>كوبونات الخصم</h2><p class="muted">أنشئ أكواد خصم ثابتة أو نسبة مئوية.</p></div></div><form id="couponForm" class="form"><input class="field" name="code" placeholder="كود الخصم مثل VIP15" required><select class="field" name="type"><option value="percent">نسبة مئوية %</option><option value="fixed">مبلغ ثابت EGP</option></select><input class="field" name="value" type="number" min="1" placeholder="قيمة الخصم" required><button class="btn gold">إضافة الكوبون</button></form><div style="margin-top:20px">${coupons.map((c,i)=>`<div class="prod" style="margin:8px 0;display:flex;align-items:center;justify-content:space-between"><div><b>${esc(c.code)}</b><p>${c.type==='percent'?c.value+'%':money(c.value)} · ${c.active===false?'متوقف':'نشط'}</p></div><div class="actions"><button class="btn" data-togglecoupon="${i}">${c.active===false?'تفعيل':'إيقاف'}</button><button class="btn danger" data-delcoupon="${i}">حذف</button></div></div>`).join('')}</div>`;$('couponForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code').trim().toUpperCase();if(coupons.some(x=>x.code===code))return alert('هذا الكود موجود بالفعل');coupons.push({code,type:f.get('type'),value:+f.get('value'),active:true});set('z_coupons',coupons);couponPage();toast('تم إنشاء الكوبون')};document.querySelectorAll('[data-togglecoupon]').forEach(b=>b.onclick=()=>{let c=coupons[+b.dataset.togglecoupon];c.active=c.active===false;set('z_coupons',coupons);couponPage()});document.querySelectorAll('[data-delcoupon]').forEach(b=>b.onclick=()=>{coupons.splice(+b.dataset.delcoupon,1);set('z_coupons',coupons);couponPage()})}
function settingsPage(){$('content').innerHTML=`<div class="sectiontitle"><div><h2>إعدادات المتجر</h2><p class="muted">عدّل بيانات التواصل ومحتوى واجهة المتجر.</p></div></div><form id="settingsForm" class="form"><label class="wide muted">رقم واتساب استقبال الطلبات<input class="field" name="whatsapp" placeholder="201001740923" value="${esc(settings.whatsapp||'201001740923')}"></label><label class="wide muted">عنوان الواجهة بالعربي (HTML مسموح للعناصر البسيطة)<input class="field" name="heroAr" value="${esc(settings.heroAr||'OVEN<span>Wear The Future</span>')}"></label><label class="wide muted">وصف الواجهة بالعربي<textarea class="field" name="taglineAr">${esc(settings.taglineAr||'أكثر من مجرد ملابس.. أسلوب حياة. اكتشف مجموعتنا واختار القطعة اللي تعبّر عن شخصيتك.')}</textarea></label><label class="wide muted">وصف الواجهة بالإنجليزي<textarea class="field" name="taglineEn">${esc(settings.taglineEn||'More than fashion — a way of life. Explore our collection and find the pieces that express your identity.')}</textarea></label><button class="btn gold wide">حفظ إعدادات المتجر</button></form><div class="notice">التغييرات تظهر على واجهة المتجر بعد إعادة تحميلها. بيانات الإعدادات والطلبات والمنتجات مشتركة بين الصفحتين على نفس المتصفح ونفس النطاق.</div>`;$('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);settings={...settings,whatsapp:String(f.get('whatsapp')).replace(/\D/g,''),heroAr:f.get('heroAr'),taglineAr:f.get('taglineAr'),taglineEn:f.get('taglineEn')};set('z_settings',settings);toast('تم حفظ الإعدادات')}}
function downloadCSV(name,rows){let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
fbAuth.onAuthStateChanged(user=>{if(user&&user.uid===ADMIN_UID){$('login').classList.add('hidden');$('app').style.display='block';startCloud();render()}else{$('app').style.display='none';$('login').classList.remove('hidden')}});
})();
</script></body></html>
